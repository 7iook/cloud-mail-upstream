name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# Anonymous share abuse protection (AC-ABUSE-08).
# Per-location, eventually consistent. period must be 10 or 60.
# namespace_id must be unique within the Cloudflare account.
[[ratelimits]]
name = "SHARE_SESSION_RATE_LIMITER"
namespace_id = "92601"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SHARE_READ_RATE_LIMITER"
namespace_id = "92602"
simple = { limit = 100, period = 60 }

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#每天晚上12点执行每日任务,刷新分析缓存


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""				#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串
#SHARE_CAPABILITY_V2 = "false"	#分享全能力发布栅栏(AC-LIFE-11),缺省即 false,代码把「缺失」当 false
						#只在 Dashboard 置 "true",且须先满足激活前置:迁移完成 + 回填重跑 + 无旧 Worker 在途 + 关键日志事件已有告警消费者
						#此处保持注释:keep_vars 拦不住 toml 里显式写的值,取消注释会把 Dashboard 的 true 覆盖回 false

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
