name = "cloud-mail-vitest"
main = "src/index.js"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]

# No [[ratelimits]] here: share-rate-limit fail-opens when the binding is
# missing so existing share tests stay green. T-26 injects a mock limiter.

# Local/in-memory D1 for vitest-pool-workers (Miniflare).
# database_id is a placeholder only — do not use a real remote D1 id.
# Never set remote = true here.
[[d1_databases]]
binding = "db"
database_name = "vitest-local-email"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "vitest-local-d1"

[[kv_namespaces]]
binding = "kv"
id = "00000000-0000-0000-0000-000000000002"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
jwt_secret = "vitest-local-jwt-secret"
domain = ["example.com"]
admin = "admin@example.com"
orm_log = false
analysis_cache = false
SHARE_ENABLED = "1"
SHARE_SEC_PEPPER = "vitest-share-sec-pepper"
SHARE_SEC_PEPPER_KID = "v1"
SHARE_SESSION_SIGNING_KEY = "vitest-share-session-signing-key"
SHARE_SESSION_SIGNING_KID = "v1"
# sec 密文持久化的 KEK(ADR-share-credential-recoverability 轨一)。生产要求它必配 ——
# 缺失时 create/regenerate 当场 fail-closed，所以基线 env 必须带上它，否则整条写入面全红。
# kid 刻意取 'k1' 而不是 'v1'：与 pepper 环的 kid 撞名会让「写错了环」这类缺陷假绿。
SHARE_SEC_KEK = "vitest-share-sec-kek-current"
SHARE_SEC_KEK_KID = "k1"
# SHARE_MAX_DURATION_SECONDS 刻意不配：这个 worker 的 env 就是「生产实际长什么样」，
# 而生产 wrangler.toml 从来没写过这一项。留空即让 HTTP 层用例跑在兜底上限（I-2，90 天）上，
# 那正是 share-api.spec.js「超长有效期被拒」那条断言要证的东西。
# 需要验证「显式配置被尊重」的用例自己在 shareEnv 覆盖，不靠这里。
# 测试基线跑在栅栏关闭态（AC-LIFE-11 默认值）；需要放行的用例自己覆盖 env。
SHARE_CAPABILITY_V2 = "false"
